<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one reading column (~74rem) of stacked report sections; tables and charts scroll inside their own frames. */
:root{
  --bg:#f5f6f8; --panel:#ffffff; --ink:#15181d; --ink-2:#4a505b; --ink-3:#6c7380; --rule:#dde1e7; --rule-2:#eceff3;
  --accent:#1c5cab; --warn:#a85d00; --warn-bg:#fff3df; --good:#1d7a46; --good-bg:#e5f5ec; --bad:#b3261e; --bad-bg:#fdebea;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --ref:#15181d;
  --h0:#f1f6fd; --h1:#cde2fb; --h2:#9ec5f4; --h3:#5598e7; --h4:#256abf; --h5:#104281; --h-ink-dark:#ffffff; --h-ink:#15181d;
  --display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#181b20; --ink:#e9ebef; --ink-2:#b9bec8; --ink-3:#8d94a1; --rule:#2c3139; --rule-2:#22262d;
  --accent:#6da7ec; --warn:#f0b04a; --warn-bg:#3a2a10; --good:#5ccf8f; --good-bg:#12301f; --bad:#ff8a80; --bad-bg:#3b1715;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --ref:#e9ebef;
  --h0:#1b2230; --h1:#1c3352; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#86b6ef; --h-ink-dark:#0d1117; --h-ink:#e9ebef;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#181b20; --ink:#e9ebef; --ink-2:#b9bec8; --ink-3:#8d94a1; --rule:#2c3139; --rule-2:#22262d;
  --accent:#6da7ec; --warn:#f0b04a; --warn-bg:#3a2a10; --good:#5ccf8f; --good-bg:#12301f; --bad:#ff8a80; --bad-bg:#3b1715;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --ref:#e9ebef;
  --h0:#1b2230; --h1:#1c3352; --h2:#184f95; --h3:#256abf; --h4:#3987e5; --h5:#86b6ef; --h-ink-dark:#0d1117; --h-ink:#e9ebef;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px}
.wrap{max-width:74rem;margin:0 auto;display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:.005em}
h1{font-size:clamp(2rem,4.6vw,3rem);line-height:1.05;font-weight:700}
h2{font-size:1.5rem;font-weight:600;line-height:1.2}
h3{font-size:1.05rem;font-weight:600}
p{margin:0;max-width:68ch}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
header{display:flex;flex-direction:column;gap:14px;padding-bottom:24px;border-bottom:1px solid var(--rule)}
.lede{font-size:1.06rem;color:var(--ink-2)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:6px}
.facts div{display:flex;flex-direction:column;gap:0}
.facts b{font-family:var(--mono);font-weight:500;font-size:1rem;font-variant-numeric:tabular-nums}
.facts span{font-size:.78rem;color:var(--ink-3)}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec-head{display:flex;flex-direction:column;gap:6px}
.sec-head p{color:var(--ink-2)}
.findings{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:12px}
.finding{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.finding .k{font-family:var(--mono);font-size:1.5rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.finding p{font-size:.92rem;color:var(--ink-2)}
.finding h3{font-size:1rem}
.frame{background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--rule-2);white-space:nowrap;vertical-align:middle}
th{font-family:var(--body);font-weight:600;font-size:.76rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;background:var(--panel);position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-size:.86rem}
td.name{font-family:var(--body);font-size:.9rem;font-weight:500}
tr:last-child td{border-bottom:none}
tr.best td{background:color-mix(in srgb,var(--good-bg) 70%,transparent)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;flex:none}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--body);font-size:.72rem;font-weight:600;padding:1px 7px;border-radius:999px;letter-spacing:.02em}
.tag.raw{background:var(--warn-bg);color:var(--warn)}
.tag.phys{background:var(--good-bg);color:var(--good)}
.bad{color:var(--bad)} .ok{color:var(--good)} .muted{color:var(--ink-3)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--ink-2);padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.ctl-label{font-size:.78rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.note{font-size:.85rem;color:var(--ink-3);max-width:80ch}
.heat td.c{min-width:96px;text-align:center;padding:6px 8px;position:relative}
.heat td.c .v{display:block;font-size:.86rem}
.heat td.c .s{display:block;font-size:.7rem;opacity:.85}
.heat td.c .flag{position:absolute;top:3px;right:4px;font-family:var(--body);font-size:.66rem;font-weight:700;padding:0 4px;border-radius:3px;background:var(--bad-bg);color:var(--bad)}
.heat td.case{font-family:var(--mono)}
.legend-ramp{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3)}
.legend-ramp i{display:inline-block;width:26px;height:12px;border-radius:2px}
.chartbox{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:14px 14px 8px;position:relative;min-width:0}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--ink-3);font-family:var(--mono);font-size:11px}
svg .axis-title{fill:var(--ink-2);font-family:var(--body);font-size:12px}
svg .grid{stroke:var(--rule-2);stroke-width:1}
svg .base{stroke:var(--rule);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:.8rem;box-shadow:0 4px 18px rgb(0 0 0 / .12);min-width:200px;z-index:5}
.tip .t{font-family:var(--mono);font-weight:500;margin-bottom:4px}
.tip .row{display:flex;align-items:center;gap:6px;justify-content:space-between;font-family:var(--mono);font-size:.78rem}
.tip .row span:first-child{display:flex;align-items:center;font-family:var(--body);color:var(--ink-2)}
.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggles label{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--panel);cursor:pointer;user-select:none}
.toggles input{accent-color:var(--accent);margin:0}
.cases{display:flex;flex-wrap:wrap;gap:6px}
.cases button{font-family:var(--mono);font-size:.78rem;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2);border-radius:5px;padding:4px 8px;cursor:pointer}
.cases button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.case-info{font-size:.88rem;color:var(--ink-2)}
dl{display:grid;grid-template-columns:minmax(10rem,14rem) 1fr;gap:10px 20px;margin:0}
dt{font-weight:600;font-size:.9rem}
dd{margin:0;color:var(--ink-2);font-size:.9rem;max-width:72ch}
code{font-family:var(--mono);font-size:.82em;background:var(--rule-2);padding:1px 5px;border-radius:3px;overflow-wrap:anywhere}
footer{border-top:1px solid var(--rule);padding-top:18px;font-size:.82rem;color:var(--ink-3);display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){dl{grid-template-columns:1fr}dl dd{margin-bottom:6px}body{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
